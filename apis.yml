  description: >-
    The Wells Fargo ACH Payments API enables commercial banking customers to initiate ACH credit and debit
    transactions, including same-day ACH, for payroll, vendor payments, and collections. The API integrates
    with Wells Fargo's intelligent payment routing that automatically selects the optimal rail including
    RTP, FedNow, and ACH for each transaction.
